plugins {
	id 'java'
	id 'org.springframework.boot' version '3.5.10'
	id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.nyam'
version = '0.0.1-SNAPSHOT'
description = 'nyam-log'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(17)
	}
}

sourceSets {
	smokeTools {
		java.srcDir 'src/smokeTools/java'
		compileClasspath += sourceSets.main.output
		runtimeClasspath += sourceSets.main.output
	}
	test {
		compileClasspath += sourceSets.smokeTools.output
		runtimeClasspath += sourceSets.smokeTools.output
	}
}

configurations {
	compileOnly {
		extendsFrom annotationProcessor
	}
	smokeToolsImplementation.extendsFrom implementation
	smokeToolsRuntimeOnly.extendsFrom runtimeOnly
}

repositories {
	mavenCentral()
}

dependencies {
	implementation 'org.springframework.boot:spring-boot-starter-actuator'
	implementation 'org.springframework.boot:spring-boot-starter-batch'
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
	implementation 'org.springframework.boot:spring-boot-starter-mail'
	implementation 'org.flywaydb:flyway-core'
	implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:2.8.17'
	implementation 'org.springframework.boot:spring-boot-starter-validation'
	implementation 'org.springframework.boot:spring-boot-starter-web'
	implementation 'org.springframework.boot:spring-boot-starter-security'
	implementation 'org.springframework.boot:spring-boot-starter-oauth2-resource-server'
	compileOnly 'org.projectlombok:lombok'
	runtimeOnly 'org.flywaydb:flyway-mysql'
	runtimeOnly 'com.mysql:mysql-connector-j'
	annotationProcessor 'org.projectlombok:lombok'
	testImplementation 'org.springframework.boot:spring-boot-testcontainers'
	testImplementation 'org.springframework.batch:spring-batch-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-test'
	testImplementation 'org.testcontainers:junit-jupiter'
	testImplementation 'org.testcontainers:mysql'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test') {
	useJUnitPlatform()
}

tasks.named('compileTestJava') {
	dependsOn tasks.named('smokeToolsClasses')
}

tasks.named('bootJar') {
	mainClass = 'com.nyam.NyamApplication'
	archiveFileName = 'nyam.jar'
}

tasks.withType(JavaCompile).configureEach {
	options.encoding = 'UTF-8'
}

tasks.withType(Javadoc).configureEach {
	options.encoding = 'UTF-8'
	options.charSet = 'UTF-8'
	options.docEncoding = 'UTF-8'
}

tasks.register('smokeToolsJavadoc', Javadoc) {
	group = 'documentation'
	description = '배포 smoke 전용 로컬 도구의 JavaDoc을 생성합니다.'
	source = sourceSets.smokeTools.allJava
	classpath = sourceSets.smokeTools.compileClasspath
	destinationDir = layout.buildDirectory.dir('docs/javadoc-smoke-tools').get().asFile
}

tasks.named('javadoc') {
	dependsOn tasks.named('smokeToolsJavadoc')
}

tasks.register('foodImport', JavaExec) {
	group = 'application'
	description = '승인된 공공 식품 CSV를 수동 Spring Batch Job으로 적재합니다.'
	classpath = sourceSets.main.runtimeClasspath
	mainClass = 'com.nyam.domain.food.batch.FoodImportApplication'
	doFirst {
		def inputPath = System.getenv('NYAM_FOOD_IMPORT_PATH')
		def releaseDate = System.getenv('NYAM_FOOD_IMPORT_RELEASE_DATE')
		def checksum = System.getenv('NYAM_FOOD_IMPORT_CHECKSUM')
		if (!inputPath || !releaseDate || !checksum) {
			throw new GradleException('NYAM_FOOD_IMPORT_PATH, NYAM_FOOD_IMPORT_RELEASE_DATE, and NYAM_FOOD_IMPORT_CHECKSUM are required')
		}
		args(
				"--food-import.path=${inputPath}",
				"--food-import.release-date=${releaseDate}",
				"--food-import.checksum=${checksum}")
	}
}

tasks.register('smokeSeedUsers', JavaExec) {
	group = 'application'
	description = '명시적으로 지정한 MySQL에 합성 smoke 사용자 A/B를 검증하거나 생성합니다.'
	dependsOn tasks.named('smokeToolsClasses')
	classpath = sourceSets.smokeTools.runtimeClasspath
	mainClass = 'com.nyam.deployment.smoke.SmokeUserSeedApplication'
}

tasks.register('smokeIssueAccessToken', JavaExec) {
	group = 'application'
	description = '검증된 smoke 사용자 A/B 중 하나의 15분 Access Token을 비공개 파일에 기록합니다.'
	dependsOn tasks.named('smokeToolsClasses')
	classpath = sourceSets.smokeTools.runtimeClasspath
	mainClass = 'com.nyam.global.security.LocalSmokeAccessTokenApplication'
}
