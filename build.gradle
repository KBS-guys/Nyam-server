plugins {
	id 'java'
	id 'org.springframework.boot' version '3.5.10'
	id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.nyam'
version = '0.0.1-SNAPSHOT'
description = 'nyam-log'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(17)
	}
}

configurations {
	compileOnly {
		extendsFrom annotationProcessor
	}
}

repositories {
	mavenCentral()
}

dependencies {
	implementation 'org.springframework.boot:spring-boot-starter-batch'
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
	implementation 'org.springframework.boot:spring-boot-starter-mail'
	implementation 'org.flywaydb:flyway-core'
	implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:2.8.17'
	implementation 'org.springframework.boot:spring-boot-starter-validation'
	implementation 'org.springframework.boot:spring-boot-starter-web'
	implementation 'org.springframework.boot:spring-boot-starter-security'
	implementation 'org.springframework.boot:spring-boot-starter-oauth2-resource-server'
	compileOnly 'org.projectlombok:lombok'
	runtimeOnly 'org.flywaydb:flyway-mysql'
	runtimeOnly 'com.mysql:mysql-connector-j'
	annotationProcessor 'org.projectlombok:lombok'
	testImplementation 'org.springframework.boot:spring-boot-testcontainers'
	testImplementation 'org.springframework.batch:spring-batch-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-test'
	testImplementation 'org.testcontainers:junit-jupiter'
	testImplementation 'org.testcontainers:mysql'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test') {
	useJUnitPlatform()
}

tasks.withType(JavaCompile).configureEach {
	options.encoding = 'UTF-8'
}

tasks.withType(Javadoc).configureEach {
	options.encoding = 'UTF-8'
	options.charSet = 'UTF-8'
	options.docEncoding = 'UTF-8'
}

tasks.register('foodImport', JavaExec) {
	group = 'application'
	description = '승인된 공공 식품 CSV를 수동 Spring Batch Job으로 적재합니다.'
	classpath = sourceSets.main.runtimeClasspath
	mainClass = 'com.nyam.domain.food.batch.FoodImportApplication'
	doFirst {
		def inputPath = System.getenv('NYAM_FOOD_IMPORT_PATH')
		def releaseDate = System.getenv('NYAM_FOOD_IMPORT_RELEASE_DATE')
		def checksum = System.getenv('NYAM_FOOD_IMPORT_CHECKSUM')
		if (!inputPath || !releaseDate || !checksum) {
			throw new GradleException('NYAM_FOOD_IMPORT_PATH, NYAM_FOOD_IMPORT_RELEASE_DATE, and NYAM_FOOD_IMPORT_CHECKSUM are required')
		}
		args(
				"--food-import.path=${inputPath}",
				"--food-import.release-date=${releaseDate}",
				"--food-import.checksum=${checksum}")
	}
}
