# Non-secret defaults shared by web, food-import and tests; external settings take precedence.
spring.application.name=nyam
spring.datasource.url=${MYSQL_URL}
spring.datasource.username=${MYSQL_USERNAME}
spring.datasource.password=${MYSQL_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=false
spring.batch.job.enabled=false
spring.batch.jdbc.initialize-schema=never
spring.sql.init.mode=never
springdoc.api-docs.enabled=${NYAM_OPENAPI_ENABLED:false}
springdoc.swagger-ui.enabled=${NYAM_OPENAPI_ENABLED:false}
springdoc.swagger-ui.persist-authorization=false
springdoc.paths-to-match=/api/v1/**
server.error.include-message=never
server.error.include-stacktrace=never
server.error.include-binding-errors=never
server.error.include-exception=false
logging.level.org.flywaydb=WARN
